<style>
:root{--bg:#0e1124;--card:#171b38;--ink:#eef1ff;--muted:#9ea7d6;--line:#2c3367;--acc:#ffd23f;--acct:#141a3a;--edge:#141a3a;--ac2:#eef1ff;--pb:var(--card);--pt:var(--ink);--rim:#27318c;--dot:#ffd23f;--winbg:rgba(246,247,255,.94);--panel:transparent;--pp:0px;--display:"Alfa Slab One","Noto Sans Arabic",Georgia,"Times New Roman",serif;--text:"Schibsted Grotesk","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#aab3dc;--card:#ccd2ee;--ink:#141a3a;--muted:#2c3560;--line:#7f8bc2;--acc:#3b4fd0;--acct:#fff;--edge:#141a3a;--ac2:#3b4fd0;--pb:var(--acc);--pt:var(--acct);--rim:#27318c;--dot:#ffd23f;color-scheme:light}
:root[data-theme="red"]{--bg:#2a0508;--card:#4a0b11;--ink:#fff1f1;--muted:#f0b4b4;--line:#a3202c;--acc:#e5202f;--acct:#fff;--edge:#2a0508;--ac2:#ff4d5a;--pb:var(--acc);--pt:var(--acct);--rim:#6e0b14;--dot:#ffc2c2;--winbg:rgba(255,236,236,.94);--panel:rgba(30,2,5,.5);--pp:16px}
:root[data-theme="brown"]{--bg:#1d130b;--card:#3a2615;--ink:#fbf1e6;--muted:#d6b996;--line:#7a5230;--acc:#b9733a;--acct:#fff;--edge:#20120a;--ac2:#d98f4e;--pb:var(--acc);--pt:var(--acct);--rim:#5a3519;--dot:#f1cf9c;--winbg:rgba(250,240,228,.94);--panel:rgba(28,17,9,.5);--pp:16px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.5 var(--text);-webkit-tap-highlight-color:transparent}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:28px;justify-items:center}
h1{margin:0;font:400 clamp(1.7rem,7vw,2.5rem)/1.1 var(--display);text-align:center}
.wheel{position:relative;width:min(88vw,440px);aspect-ratio:1;margin-top:20px}
.stage{position:absolute;inset:0;border-radius:50%;box-shadow:0 26px 30px -22px rgba(10,14,40,.7)}
#c{display:block;width:100%;height:100%;will-change:transform}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.pointer{position:absolute;left:50%;top:-20px;width:34px;height:43px;translate:-50% 0;transform-origin:50% 35%;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.pointer path{fill:var(--acc);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.pointer circle{fill:var(--edge)}
#spin{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;translate:-50% -50%;z-index:2;border:5px solid var(--edge);border-radius:50%;background:var(--acc);color:var(--acct);font:400 clamp(1.05rem,5vw,1.5rem)/1 var(--display);cursor:pointer;box-shadow:0 6px 0 var(--edge),0 12px 18px rgba(0,0,0,.3)}
#spin:active:not(:disabled){translate:-50% calc(-50% + 4px);box-shadow:0 2px 0 var(--edge),0 4px 8px rgba(0,0,0,.3)}
:is(input,button):disabled{opacity:.55;cursor:default}
.side{display:grid;gap:16px;width:min(100%,440px);background:var(--panel);padding:var(--pp);border-radius:22px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.result{display:grid;align-content:center;min-height:4.75rem;padding:14px 20px;border:2px solid var(--rc,var(--line));border-radius:18px;background:var(--rc,var(--card));color:var(--rt,var(--ink));font:400 clamp(1.5rem,7vw,2.1rem)/1.15 var(--display);overflow-wrap:anywhere}
.result.idle{color:var(--muted);font:600 1rem/1.4 var(--text)}
.hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hist:empty{display:none}
.cap{color:var(--muted);font-size:.85rem;font-weight:600}
.chip{padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:700}
fieldset{min-width:0;margin:0;padding:0;border:0;display:grid;gap:16px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--ac2)}
input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--ac2)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.row label,.row b{font-weight:700}
.row span{color:var(--muted);font-variant-numeric:tabular-nums}
.r{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;height:44px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 1rem var(--text)}
input[type=color]{flex:none;width:44px;height:44px;padding:3px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch,input[type=color]::-moz-color-swatch{border:0;border-radius:7px}
.x,.btn{height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:700 .95rem var(--text);cursor:pointer}
.x{flex:none;width:44px;font-size:1.3rem;line-height:1}
.btn{padding:0 16px}
.btns{display:flex;flex-wrap:wrap;gap:8px}.btns .btn{flex:1 1 auto}
:is(input,button):focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.slots{display:grid;gap:8px;margin-top:14px}
.slot{display:flex;gap:8px}
.slot .sname{flex:1;height:auto;min-height:48px;display:grid;gap:5px;justify-items:center;align-content:center;padding:6px 12px}
.slot .sname.empty{border-style:dashed;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:10px}
.sw i{width:12px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.slot.ok .sname{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--acc);color:var(--acct)}100%{background:var(--card)}}
.win{position:fixed;inset:0;z-index:8;display:grid;align-content:center;justify-items:center;gap:.3em;padding:24px;text-align:center;background:var(--winbg);cursor:pointer;animation:pop .35s ease-out}
.win[hidden]{display:none}
.wn{max-width:100%;font:800 clamp(3rem,17vw,8rem)/1.25 var(--text);color:var(--wc,#000);-webkit-text-stroke:.12em #000;paint-order:stroke fill;stroke-linejoin:round;overflow-wrap:anywhere}
.wt{font:800 clamp(1.5rem,7vw,3rem)/1.5 var(--text);color:#141a3a}
.wx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border:2px solid #141a3a;border-radius:50%;background:#fff;color:#141a3a;font:700 1.5rem/1 var(--text);cursor:pointer}
@keyframes pop{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
@media (prefers-reduced-motion:reduce){.win,.slot.ok .sname{animation:none}}
@media (min-width:860px){main{grid-template-columns:auto 380px;justify-content:center;align-items:start;column-gap:56px}h1{grid-column:1/-1}.side{width:100%}}
